name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run tokens:check
      - run: npm run assets:check
      - run: npm run migrations:check
      - run: npm run security:secrets
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
