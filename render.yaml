# Render Blueprint for CE Vault — USDT Arbitrage Dashboard (Next.js)
# Docs: https://render.com/docs/blueprint-spec
#
# This deploys the Next.js app as a single web service (SSR: API routes +
# middleware, so it is NOT a static site). The database is external Supabase,
# so no Render-managed Postgres is provisioned here.
#
# Secrets are marked `sync: false` — fill them in the Render Dashboard after
# the first apply. Values marked `generateValue: true` are generated by Render.
services:
  - type: web
    name: ce-vault
    runtime: node
    plan: free
    # Health check hits the public landing page (returns 200). The /api/health
    # route intentionally returns 503 until production secrets are configured,
    # so it is not used as the health check path.
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # ===== Supabase (required) =====
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Server-only. New-style secret key (sb_secret_...) or legacy service role key.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: slips

      # ===== API security + dashboard PIN gate =====
      # Bearer secret for write/cron endpoints. Retrieve the generated value
      # from the Dashboard to configure external callers.
      - key: API_SECRET
        generateValue: true
      # Never allow insecure write APIs in production.
      - key: ALLOW_INSECURE_DEV_API
        value: "0"
      # 6-digit PIN for /dashboard.
      - key: DASHBOARD_PIN
        sync: false
      # HMAC session signing secret (>= 32 chars).
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true

      # ===== Telegram bot =====
      - key: BOT_TOKEN
        sync: false
      # 16–256 chars [A-Za-z0-9_-]; must differ from API_SECRET.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      # HTTPS origin of this service, e.g. https://ce-vault.onrender.com
      - key: APP_URL
        sync: false

      # ===== Rates & account defaults =====
      - key: DEFAULT_SELL_RATE
        value: "35.5"
      - key: DEFAULT_MARKET_RATE
        value: "34.8"

      # ===== AI / OCR (optional — set the providers you use) =====
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OCR_AUTO_MIN
        value: "90"
