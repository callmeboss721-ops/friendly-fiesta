stages: [quality, security, test, build, deploy]

default:
  image: node:20-bookworm-slim
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

quality:
  stage: quality
  script:
    - npm run typecheck
    - npm run tokens:check
    - npm run assets:check
    - npm run migrations:check

secret_detection:
  stage: security
  script: ["npm run security:secrets"]

unit_and_regression:
  stage: test
  script: ["npm test"]

build:
  stage: build
  script: ["npm run build"]
  artifacts:
    paths: [.next/]
    expire_in: 1 day

deploy_staging:
  stage: deploy
  image: alpine/helm:3.16.4
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KUBE_CONFIG_STAGING'
      when: manual
    - when: never
  script:
    - helm upgrade --install ce-vault ./helm/ce-vault --namespace ce-vault-staging --create-namespace --atomic --wait --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHA"
    - kubectl -n ce-vault-staging rollout status deployment/ce-vault --timeout=180s

deploy_production:
  stage: deploy
  image: alpine/helm:3.16.4
  before_script: []
  environment: production
  rules:
    - if: '$CI_COMMIT_TAG && $KUBE_CONFIG_PRODUCTION'
      when: manual
    - when: never
  script:
    - helm upgrade --install ce-vault ./helm/ce-vault --namespace ce-vault --create-namespace --atomic --wait --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHA"
